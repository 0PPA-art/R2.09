<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Title : ma première page</title>
    <link rel="stylesheet" type="text/css" href="{%static 'myfirstapp/index.css' %}">
</head>
<body>
    <form action="/myfirstapp/bonjour" method="get">
    {% csrf_token %}
        <label for="nom"> Nom :</label>
        <input type="text" name="nom"/>
        <input type="submit" value="envoyer"/>
    </form>

{% if nom is not None %}
    <h1> Hello {{nom}} </h1>
{% else %}
    <h1> Hello world </h1>
{% endif %}
</body>
</html>
